[package]
name = "helm"
version = "0.2.0"
description = "Helm — a fast, focused agent cockpit for AI-assisted development"
authors = ["Steve"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name unique so it won't conflict with the bin
# name on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "helm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.25"
rand = "0.9"
subtle = "2"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
